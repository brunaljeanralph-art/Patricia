<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Pour toi Mi Amor ❤️</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <!-- PATRICIA EXPERIENCE -->
  <link
    rel="stylesheet"
    href="experience.css"
  >
</head>


<body>

  <!-- =====================================================
       EXISTING INTRO
       ===================================================== -->

  <div
    id="intro-screen"
    class="intro-screen"
  >

    <div class="intro-overlay"></div>

    <div class="intro-content">

      <div class="intro-heart">
        🤍
      </div>

      <h1>
        Un dernier petit secret... t'attend ❤️
      </h1>

      <p>
        J'ai laissé quelque chose ici pour toi...
      </p>

      <button
        id="openSurpriseBtn"
        type="button"
      >
        Ouvrir ma surprise
      </button>

    </div>

  </div>


  <!-- =====================================================
       WELCOME POPUP
       ===================================================== -->

  <div
    id="welcome-popup"
    class="welcome-popup"
  >

    <div class="popup-card">

      <div class="popup-heart">
        ❤️
      </div>

      <h2>
        Bienvenue, Mi Amor
      </h2>

      <p>
        Avant de continuer...
      </p>

      <p>
        prends juste quelques secondes
        pour découvrir ce que j'ai préparé pour toi.
      </p>

      <button
        id="continueBtn"
        type="button"
      >
        Continuer ❤️
      </button>

    </div>

  </div>


  <!-- =====================================================
       MUSIC
       ===================================================== -->

  <button
    id="music-btn"
    type="button"
    aria-label="Contrôler la musique"
  >
    ♫
  </button>


  <audio
    id="bgMusic"
    src="assets/music.mp3"
    loop
    preload="auto"
  ></audio>


  <audio
    id="dingSound"
    src="assets/ding.mp3"
    preload="auto"
  ></audio>


  <!-- =====================================================
       BACKGROUND
       ===================================================== -->

  <div class="background"></div>

  <div id="stars"></div>

  <div id="hearts-container"></div>

  <div id="petals-container"></div>

  <div id="confetti-container"></div>


  <!-- =====================================================
       EXISTING LETTER
       ===================================================== -->

  <main class="card">

    <div class="header">

      <img
        src="assets/tulip.png"
        class="header-tulip"
        alt=""
      >

      <div class="title">

        <h1>
          Pour toi Mi Amor ❤️
        </h1>

        <h2>
          Mon dernier petit secret🫣
        </h2>

      </div>

      <img
        src="assets/tulip.png"
        class="header-tulip"
        alt=""
        style="transform: scaleX(-1)"
      >

    </div>


    <!-- =================================================
         LETTRE
         ================================================= -->

    <div class="secret-letter">

      <!--
        METS ICI TON VRAI TEXTE DE LETTRE COMPLET.
        PA CHANJE LI.
      -->

      <p>
        Patricia...
      </p>

    </div>


    <div class="relire-letter">

      <a
        href="lettre.pdf"
        target="_blank"
      >
        Télécharger ma lettre ❤️
      </a>

    </div>

  </main>


  <!-- =====================================================
       EXISTING SCRIPT
       ===================================================== -->

  <script src="script.js"></script>


  <!-- =====================================================
       PATRICIA EXPERIENCE
       ===================================================== -->

  <script src="experience.js"></script>

</body>

</html>
